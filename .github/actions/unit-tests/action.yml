name: JavaScript runtime tests
description: Node.js 22, FFmpeg/FFprobe, standalone yt-dlp and real browser/media tests.
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - name: Install FFmpeg and FFprobe
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ffmpeg
    - name: Run JavaScript, media and browser tests
      shell: bash
      run: "${GITHUB_WORKSPACE}/ci/test/run.sh"
